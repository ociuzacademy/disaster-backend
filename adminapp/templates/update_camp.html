{% extends "index.html" %}

{% block content %}
<section class="content">
    <div class="container-fluid">
        <h1 class="text-center my-4">Update Camp</h1>
        <div class="container custom-form-container">
            <form method="post" action="{% url 'update_camp' camp.id %}" enctype="multipart/form-data" class="mt-4 shadow p-4 bg-light rounded">
                {% csrf_token %}

                {% if camp.profile_pic %}
                    <div class="mb-3 text-center">
                        <img src="{{ camp.profile_pic.url }}" alt="Profile Picture" class="img-thumbnail mb-3" width="150">
                        <p class="text-muted">Current Profile Picture</p>
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="name" class="form-label">Camp Name:</label>
                    <input type="text" id="name" name="name" class="form-control" required placeholder="Enter camp name" value="{{ camp.name }}">
                </div>

                <div class="mb-3">
                    <label for="district" class="form-label">District:</label><br>
                    <select id="district" name="district" class="form-select" required>
                        <option value="">Select District</option>
                        <option value="Thiruvananthapuram" {% if camp.district == "Thiruvananthapuram" %}selected{% endif %}>Thiruvananthapuram</option>
                        <option value="Kollam" {% if camp.district == "Kollam" %}selected{% endif %}>Kollam</option>
                        <option value="Pathanamthitta" {% if camp.district == "Pathanamthitta" %}selected{% endif %}>Pathanamthitta</option>
                        <option value="Alappuzha" {% if camp.district == "Alappuzha" %}selected{% endif %}>Alappuzha</option>
                        <option value="Kottayam" {% if camp.district == "Kottayam" %}selected{% endif %}>Kottayam</option>
                        <option value="Idukki" {% if camp.district == "Idukki" %}selected{% endif %}>Idukki</option>
                        <option value="Ernakulam" {% if camp.district == "Ernakulam" %}selected{% endif %}>Ernakulam</option>
                        <option value="Thrissur" {% if camp.district == "Thrissur" %}selected{% endif %}>Thrissur</option>
                        <option value="Palakkad" {% if camp.district == "Palakkad" %}selected{% endif %}>Palakkad</option>
                        <option value="Malappuram" {% if camp.district == "Malappuram" %}selected{% endif %}>Malappuram</option>
                        <option value="Kozhikode" {% if camp.district == "Kozhikode" %}selected{% endif %}>Kozhikode</option>
                        <option value="Wayanad" {% if camp.district == "Wayanad" %}selected{% endif %}>Wayanad</option>
                        <option value="Kannur" {% if camp.district == "Kannur" %}selected{% endif %}>Kannur</option>
                        <option value="Kasargod" {% if camp.district == "Kasargod" %}selected{% endif %}>Kasargod</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address:</label>
                    <input type="text" id="address" name="address" class="form-control" required placeholder="Enter address" value="{{ camp.address }}">
                </div>

                <div class="mb-3">
                    <label for="gmap_link" class="form-label">Google Maps Link:</label>
                    <input type="text" id="gmap_link" name="gmap_link" class="form-control" placeholder="Paste Google Maps link here" value="{{ camp.gmap_link }}" onblur="extractCoordinates()">
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">Location (Coordinates):</label>
                    <input type="text" id="latitude" name="latitude" class="form-control" placeholder="Latitude" value="{{ camp.latitude }}" readonly required>
                    <input type="text" id="longitude" name="longitude" class="form-control mt-2" placeholder="Longitude" value="{{ camp.longitude }}" readonly required>
                </div>

                <div class="mb-3">
                    <label for="contact_person" class="form-label">Contact Person:</label>
                    <input type="text" id="contact_person" name="contact_person" class="form-control" required placeholder="Enter contact person name" value="{{ camp.contact_person }}">
                </div>

                <div class="mb-3">
                    <label for="contact_phone" class="form-label">Contact Phone:</label>
                    <input type="text" id="contact_phone" name="contact_phone" class="form-control" required placeholder="Enter contact phone" value="{{ camp.contact_phone }}">
                </div>

                <div class="mb-3">
                    <label for="contact_email" class="form-label">Contact Email:</label>
                    <input type="email" id="contact_email" name="contact_email" class="form-control" required placeholder="Enter contact email" value="{{ camp.contact_email }}">
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description:</label>
                    <textarea id="description" name="description" class="form-control" placeholder="Enter description">{{ camp.description }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="profile_pic" class="form-label">Profile Picture:</label>
                    <input type="file" id="profile_pic" name="profile_pic" class="form-control" accept="image/*">
                    <p class="text-muted">Upload a new picture to replace the current one, or leave this field empty to keep the existing picture.</p>
                </div>

                <button type="submit" class="btn btn-primary">Update</button>
            </form>
        </div>
    </div>
</section>

<script>
    function extractCoordinates() {
        const gmapLink = document.getElementById('gmap_link').value;
        const latitudeInput = document.getElementById('latitude');
        const longitudeInput = document.getElementById('longitude');

        const regex = /data=.*?(\d+\.\d+).*?(\d+\.\d+)/;
        const match = gmapLink.match(regex);

        if (match) {
            const latitude = match[1];
            const longitude = match[2];

            latitudeInput.value = latitude;
            longitudeInput.value = longitude;
        } else {
            latitudeInput.value = '';
            longitudeInput.value = '';
            alert("Invalid Google Maps link. Please make sure it contains coordinates in the 'data=' format.");
        }
    }

    {% if success %}
        alert('Camp updated successfully!');
        window.location.href = "{% url 'camp_list' %}";
    {% endif %}
</script>

<style>
    .custom-form-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ced4da;
        border-radius: 10px;
        background-color: #f8f9fa;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
</style>

{% endblock %}
